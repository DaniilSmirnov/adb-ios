name: Import legacy adb-ios sources

on:
  push:
    paths:
      - .github/workflows/import-upstream.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream sources
        run: git clone --depth 1 https://github.com/zonghai-li/adb-ios.git /tmp/adb-ios-upstream

      - name: Import repository contents
        run: |
          rsync -a --exclude='.git' /tmp/adb-ios-upstream/ ./
          rm -f .github/workflows/import-upstream.yml

      - name: Commit imported sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import legacy adb-ios sources"
          git push

# trigger import after workflow registration
